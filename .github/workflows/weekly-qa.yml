name: Weekly QA Report

on:
  schedule:
    # Friday 08:00 KST = Thursday 23:00 UTC
    - cron: '0 23 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip push notification (print report only)'
        required: false
        default: 'false'
        type: boolean

jobs:
  weekly-qa:
    name: Run Weekly QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qa/package.json

      - name: Install QA dependencies
        run: npm install
        working-directory: qa

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Weekly QA
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
          JAY_FCM_TOKEN: ${{ inputs.dry_run == 'true' && '' || secrets.JAY_FCM_TOKEN }}
        run: node weekly-qa.js
        working-directory: qa
